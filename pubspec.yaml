name: flutter_quill_delta_easy_parser
description: "Convert your Quill Delta into a simplified document format, making it easier to manage and manipulate text attributes"
version: 1.0.5
documentation: https://github.com/CatHood0/flutter_quill_delta_easy_parser
homepage: https://github.com/CatHood0/flutter_quill_delta_easy_parser
issue_tracker: https://github.com/CatHood0/flutter_quill_delta_easy_parser/issues

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: ">=1.17.0"

topics:
  - quill-delta 
  - delta 
  - document 
  - rich-text 
  - flutter-quill

dependencies:
  collection: ^1.18.0
  dart_quill_delta: ^10.8.3
  equatable: ^2.0.7
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
